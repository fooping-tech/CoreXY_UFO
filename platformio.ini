; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
monitor_speed = 115200
framework = arduino
lib_deps =
  m5stack/M5Unified
  gin66/FastAccelStepper
  fastled/FastLED
  teemuatlut/TMCStepper
; src/hwtest/ is the controller PCB test firmware and src/sts3020test/ is the
; STS3020 standalone test firmware; exclude both from the plotter.
build_src_filter =
  +<*>
  -<hwtest/>
  -<sts3020test/>

[env:m5stack-core2-sim]
extends = env:m5stack-core2
build_flags =
  -DSIMULATION_MODE=1

; Controller PCB hardware test firmware (see tools/serial_tool/docs/hwtest-check.md).
; Reuses only the hardware driver modules; no planner/G-code/homing.
[env:m5stack-core2-hwtest]
extends = env:m5stack-core2
build_src_filter =
  -<*>
  +<hwtest/>
  +<TMC2209Manager.cpp>
  +<StepperBackendFastAccel.cpp>
  +<PenController.cpp>
  +<NeoPixelController.cpp>

; FEETECH STS3020 standalone bring-up firmware (see
; tools/serial_tool/docs/sts3020-test-check.md). Uses only Core2, USB Serial and
; UART1 on Port A. No CoreXY/TMC2209/NeoPixel/UI modules are linked.
[env:m5stack-core2-sts3020-test]
platform = espressif32
board = m5stack-core2
monitor_speed = 115200
framework = arduino
lib_deps =
  m5stack/M5Unified
  https://github.com/ftservo/FTServo_Arduino.git
build_src_filter =
  -<*>
  +<sts3020test/>
